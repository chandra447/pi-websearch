<text x="868" y="888" class="mono" font-size="12.5" fill="#e6edf3">duckduckgo</text>
<rect x="1023" y="862" width="176" height="42" rx="8" fill="#1c2330" stroke="#2b3442" stroke-width="1"/>
<circle cx="1041" cy="883" r="4.5" fill="#3fb950"/>
<text x="1055" y="888" class="mono" font-size="12.5" fill="#e6edf3">firecrawl</text>
<rect x="1210" y="862" width="176" height="42" rx="8" fill="#1c2330" stroke="#2b3442" stroke-width="1"/>
