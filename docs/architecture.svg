<text x="1242" y="888" class="mono" font-size="12.5" fill="#e6edf3">startpage</text>
<rect x="1397" y="862" width="176" height="42" rx="8" fill="#1c2330" stroke="#2b3442" stroke-width="1"/>
<circle cx="1415" cy="883" r="4.5" fill="#3fb950"/>
<text x="1429" y="888" class="mono" font-size="12.5" fill="#e6edf3">bravehtml</text>
<rect x="88" y="914" width="176" height="42" rx="8" fill="#1c2330" stroke="#2b3442" stroke-width="1"/>
<circle cx="106" cy="935" r="4.5" fill="#3fb950"/>
<text x="120" y="940" class="mono" font-size="12.5" fill="#e6edf3">marginalia</text>
<rect x="275" y="914" width="176" height="42" rx="8" fill="#1c2330" stroke="#2b3442" stroke-width="1"/>
