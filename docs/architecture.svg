<rect x="649" y="862" width="176" height="42" rx="8" fill="#1c2330" stroke="#2b3442" stroke-width="1"/>
<circle cx="667" cy="883" r="4.5" fill="#3fb950"/>
<text x="681" y="888" class="mono" font-size="12.5" fill="#e6edf3">bing</text>
<rect x="836" y="862" width="176" height="42" rx="8" fill="#1c2330" stroke="#2b3442" stroke-width="1"/>
